name: Deploy public playtest and support page

on:
  push:
    branches:
      - main
      - agent/owner-compute-sponsorship
    paths:
      - 'docs/index.html'
      - 'docs/support/**'
      - '.github/workflows/deploy-support-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload support page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
