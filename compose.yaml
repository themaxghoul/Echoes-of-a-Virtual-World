services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - eov-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  eov-mongo:
